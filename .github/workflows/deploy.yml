name: Build and deploy site

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Restore node_modules cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}
    - name: Restore txt-hours-react node_modules cache
      uses: actions/cache@v4
      with:
        path: submodules/txt-hours-react/node_modules
        key: txt-hours-react-node-modules-${{ hashFiles('submodules/txt-hours-react/package-lock.json') }}
    - name: Install dependencies
      run: npm ci
    - name: Build site
      run: npm run build
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
    
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
